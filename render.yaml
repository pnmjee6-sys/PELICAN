services:
  - type: web
    name: context-passport-api
    runtime: python
    plan: free
    buildCommand: python -m pip install -r backend/requirements.lock
    startCommand: cd backend && python server.py
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.15
      - key: BUILD_MARKER
        value: pelican-v3-render-001
      - key: APP_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: PUBLIC_HOSTING
        value: "true"
      - key: ALLOW_TEST_AUTH
        value: "false"
      - key: ALLOW_OFFLINE_EMBEDDINGS
        value: "false"
      - key: LLM_PROVIDER
        value: openrouter
      - key: EMBEDDING_PROVIDER
        value: openrouter
      - key: EXTRACTION_PRIMARY_MODEL
        value: z-ai/glm-5.3-flash
      - key: EXTRACTION_FALLBACK_MODEL
        value: google/gemini-2.5-flash-lite
      - key: EMBEDDING_MODEL
        value: openai/text-embedding-3-small
      - key: EMBEDDING_DIMS
        value: 1536
      - key: OPENROUTER_SPENDING_CAP
        value: "2.00"
      - key: ENABLE_JEV_VALIDATION
        value: "false"
      - key: JEV_MODEL
        value: typesafe/jev-router
      - key: MEM0_TELEMETRY
        value: "false"
      - key: MONGODB_DB_NAME
        value: context_passport
      - key: MONGODB_COLLECTION_NAME
        value: memories
      - key: MONGODB_VECTOR_INDEX_NAME
        value: memories_vector_index_scoped
      - key: OPENROUTER_API_KEY
        sync: false
      - key: MONGODB_URI
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
